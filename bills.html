<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#070B17">
  <title>Power Plan Bills</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://accounts.google.com/gsi/client" async></script>
  <script type="module" src="js/bills.js"></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="./"><span class="brand__mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></span>Power Plan</a>
    <nav id="nav" aria-label="Pages"></nav>
    <div class="who" id="who"></div>
  </header>

  <p id="demo" class="status status--demo" hidden><strong>DEMO DATA – not your meter.</strong> These numbers are made up.</p>
  <section id="signin" class="login" aria-label="Sign in" hidden></section>
  <p id="status" class="status" hidden></p>
  <div id="cyclebar" class="cyclebar" hidden></div>

  <main id="main" hidden>
    <div class="page-head">
      <h1>Bills</h1>
      <div id="billTabs" class="seg" role="tablist" aria-label="Bills"></div>
    </div>

    <div id="tabBreakdown" role="tabpanel" hidden>
      <section class="panel">
        <div class="panel__head">
          <div>
            <h2 id="bdTitle">Bill breakdown</h2>
            <p id="bdNote" class="muted"></p>
          </div>
          <div id="bdView" class="seg" role="group" aria-label="Which bill"></div>
        </div>
        <dl id="bdFacts" class="facts"></dl>
      </section>

      <div class="grid2">
        <section class="panel">
          <h2>Slab calculation</h2>
          <div class="table-wrap"><table id="slabs" class="bill-table"></table></div>
          <p id="slabNote" class="muted-sm"></p>
        </section>
        <section class="panel">
          <h2>Bill component wise details</h2>
          <div class="table-wrap"><table id="components" class="bill-table"></table></div>
          <p id="payNote" class="muted-sm"></p>
        </section>
      </div>

      <section class="panel">
        <h2 id="wiTitle">What would change the bill</h2>
        <ul id="whatIf" class="whatif"></ul>
      </section>
      <p class="foot no-print"><button id="print" class="btn btn--small" type="button">Print / save as PDF</button></p>
    </div>

    <div id="tabUploads" role="tabpanel" hidden></div>
  </main>
</body>
</html>
