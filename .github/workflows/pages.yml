# Publishes one GitHub Pages site with both environments:
#   main → https://gjangra09.github.io/power-plan-web/      (prod)
#   uat  → https://gjangra09.github.io/power-plan-web/uat/  (UAT)
# Every push to either branch rebuilds both. If any test fails nothing is published,
# so both sites stay on their last good version.
name: Publish site

on:
  push:
    branches: [main, uat]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, path: prod }
      - uses: actions/checkout@v4
        with: { ref: uat, path: uat }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Test prod
        run: npm test
        working-directory: prod
      - name: Test UAT
        run: npm test
        working-directory: uat
      - name: Assemble site
        run: |
          copy() { rsync -a --exclude '.git' --exclude '.github' --exclude 'apps-script' --exclude 'tests' --exclude 'package.json' --exclude '.gitignore' --exclude 'README.md' "$1"/ "$2"/; }
          mkdir -p _site/uat
          copy prod _site
          copy uat _site/uat
          touch _site/.nojekyll
          ls -R _site | head -40
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
