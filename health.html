<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#070B17">
  <title>Power Plan Health</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://accounts.google.com/gsi/client" async></script>
  <script type="module" src="js/health.js"></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="./"><span class="brand__mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></span>Power Plan</a>
    <nav id="nav" aria-label="Pages"></nav>
    <div class="who" id="who"></div>
  </header>

  <p id="demo" class="status status--demo" hidden><strong>DEMO DATA – not your meter.</strong> These numbers are made up.</p>
  <section id="signin" class="login" aria-label="Sign in" hidden></section>
  <p id="status" class="status" hidden></p>

  <main id="main" hidden>
    <div class="page-head">
      <h1 id="overall">Service health</h1>
      <div class="row">
        <span id="checked" class="muted-sm"></span>
        <button id="refresh" class="btn btn--small" type="button">Refresh</button>
      </div>
    </div>
    <section id="checks" class="health-grid" aria-label="Checks"></section>
    <div class="grid2">
      <section class="panel">
        <h2>Recent background jobs</h2>
        <div class="table-wrap"><table id="jobs" class="bill-table"></table></div>
      </section>
      <section class="panel">
        <h2>Open alerts and recent errors</h2>
        <ul id="alerts" class="whatif"></ul>
        <div class="table-wrap"><table id="errors" class="bill-table"></table></div>
      </section>
    </div>
    <p id="build" class="foot"></p>
  </main>
</body>
</html>
